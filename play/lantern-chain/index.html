<!DOCTYPE html>
<html lang="en">
<head>
  <!-- No <base href>: every URL is relative, so the game also works in a
       sub-folder (itch.io iframe, website /play/lantern-chain/, Facebook). -->
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="description" content="Lantern Chain: sort the paper lanterns by colour on their strings. A calm colour-sort puzzle from the Hoshikaze Valley lantern festival.">
  <meta name="theme-color" content="#0B0820">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Lantern Chain">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Lantern Chain</title>
  <style>
    body { -webkit-user-select: none; -moz-user-select: none; user-select: none;
           -webkit-touch-callout: none; touch-action: none; }
  </style>
  <script>
    window.addEventListener('wheel', function (e) { e.preventDefault(); }, { passive: false });
    window.addEventListener('keydown', function (e) {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Spacebar'].indexOf(e.key) >= 0) e.preventDefault();
    });
    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  </script>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #0B0820; overflow: hidden; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      color: #9BFBFF; font: 600 16px system-ui, sans-serif; letter-spacing: 2px;
      background: radial-gradient(circle at 50% 35%, #2E2A6B, #0B0820 70%);
    }
    #loading .lantern {
      width: 46px; height: 40px; border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #FFE6F2, #FF5FB0 55%, #8A2050);
      box-shadow: 0 0 28px #FF5FB0; animation: sway 1.6s ease-in-out infinite;
    }
    @keyframes sway { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
  </style>
</head>
<body>
  <div id="loading"><div class="lantern"></div>LIGHTING THE LANTERNS…</div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
