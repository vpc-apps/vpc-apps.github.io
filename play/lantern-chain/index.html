<!DOCTYPE html>
<html lang="en">
<head>
  <!-- No <base href>: every URL is relative, so the game also works in a
       sub-folder (itch.io iframe, website /play/lantern-chain/, Facebook). -->
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="description" content="Lantern Chain: sort the paper lanterns by colour on their strings. A calm colour-sort puzzle from the Hoshikaze Valley lantern festival.">
  <meta name="theme-color" content="#0B0820">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Lantern Chain">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Lantern Chain</title>
  <style>
    body { -webkit-user-select: none; -moz-user-select: none; user-select: none;
           -webkit-touch-callout: none; touch-action: none; }
  </style>
  <script>
    window.addEventListener('wheel', function (e) { e.preventDefault(); }, { passive: false });
    window.addEventListener('keydown', function (e) {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Spacebar'].indexOf(e.key) >= 0) e.preventDefault();
    });
    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  </script>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #0B0820; overflow: hidden; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      color: #9BFBFF; font: 600 16px system-ui, sans-serif; letter-spacing: 2px;
      background: radial-gradient(circle at 50% 35%, #2E2A6B, #0B0820 70%);
    }
    #loading .lantern {
      width: 46px; height: 40px; border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #FFE6F2, #FF5FB0 55%, #8A2050);
      box-shadow: 0 0 28px #FF5FB0; animation: sway 1.6s ease-in-out infinite;
    }
    @keyframes sway { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
  </style>
</head>
<body>
  <style>
    #vpc-loader { position: fixed; inset: 0; z-index: 50; overflow: hidden; background: #150f35;
      transition: opacity .35s; font: 700 15px system-ui, sans-serif; color: #fff; }
    #vpc-loader .blur { position: absolute; inset: -40px; background: url(loader.webp) center / cover;
      filter: blur(22px) brightness(.55); }
    #vpc-loader img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
    #vpc-loader .box { position: absolute; left: 50%; bottom: 7%; transform: translateX(-50%);
      width: min(72vw, 520px); text-align: center; }
    #vpc-loader .bar { height: 16px; border-radius: 9px; background: #0009; border: 2px solid #fff6;
      overflow: hidden; box-shadow: 0 0 18px #0008; }
    #vpc-loader .fill { height: 100%; width: 3%; border-radius: 7px; transition: width .25s;
      background: linear-gradient(90deg, #ff3da8, #ffd34d); box-shadow: 0 0 14px #ff3da8; }
    #vpc-loader .txt { margin-top: 8px; letter-spacing: 1px; text-shadow: 0 1px 4px #000; }
    #vpc-loader .tip { margin-top: 4px; font-size: 13px; opacity: .85; text-shadow: 0 1px 4px #000; }
  </style>
  <div id="vpc-loader"><div class="blur"></div><img src="loader.webp" alt="Lantern Chain">
    <div class="box"><div class="bar"><div class="fill"></div></div>
      <div class="txt">LOADING…</div><div class="tip">Move lanterns. Fill a string with one colour to light it.</div></div></div>
  <script>
  (function () {
    var total = 8596852, got = 0, shown = 0.03, seen = {}, done = false;
    var el = document.getElementById('vpc-loader');
    var fill = el.querySelector('.fill'), txt = el.querySelector('.txt');
    function mb(b) { return (b / 1048576).toFixed(1); }
    function draw() {
      fill.style.width = (shown * 100).toFixed(1) + '%';
      txt.textContent = 'LOADING… ' + mb(Math.min(got, total)) + ' / ' + mb(total) + ' MB';
    }
    try {
      new PerformanceObserver(function (list) {
        list.getEntries().forEach(function (e) {
          if (seen[e.name]) return;
          seen[e.name] = 1;
          got += e.decodedBodySize || e.encodedBodySize || 0;
        });
      }).observe({ type: 'resource', buffered: true });
    } catch (e) {}
    var timer = setInterval(function () {
      if (done) return;
      var real = Math.min(0.97, got / total);
      // Creep towards the next step while a big file is still coming.
      shown = Math.max(real, shown + (Math.min(real + 0.15, 0.95) - shown) * 0.04);
      draw();
    }, 100);
    draw();
    window.vpcLoaderDone = function () {
      if (done) return;
      done = true;
      clearInterval(timer);
      shown = 1;
      got = total;
      draw();
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 400);
    };
  })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
