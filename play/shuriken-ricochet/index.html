<!DOCTYPE html>
<html lang="en">
<head>
  <!-- No <base href>: every URL is relative, so the game also works in a
       sub-folder (portal iframes, itch.io, our website). -->
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="description" content="Shuriken Ricochet: bank your shuriken off the walls, knock out every guard and beat Lord Onibi's lieutenants.">
  <meta name="theme-color" content="#0B0820">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Shuriken Ricochet">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Shuriken Ricochet</title>
  <style>
    body { -webkit-user-select: none; -moz-user-select: none; user-select: none;
           -webkit-touch-callout: none; touch-action: none; }
  </style>
  <script>
    window.addEventListener('wheel', function (e) { e.preventDefault(); }, { passive: false });
    window.addEventListener('keydown', function (e) {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Spacebar'].indexOf(e.key) >= 0) e.preventDefault();
    });
    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  </script>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #0B0820; overflow: hidden; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      color: #9BFBFF; font: 700 16px system-ui, sans-serif; letter-spacing: 3px;
      background: radial-gradient(circle at 50% 40%, #2E2A6B, #0B0820 70%);
    }
    #loading .star {
      width: 48px; height: 48px; background: #E8E4F4;
      clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%);
      filter: drop-shadow(0 0 8px #FF3DA8); animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading"><div class="star"></div>SHARPENING SHURIKEN…</div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
